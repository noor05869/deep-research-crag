[project]
name = "deep-research-crag"
version = "0.1.0"
description = "Autonomous Deep Research & Corrective-RAG (CRAG) Engine with LangGraph and Gemini"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ddgs>=9.16.1",
    "duckduckgo-search>=8.1.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint>=4.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "torch",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { path = "wheels/torch-2.5.1+cpu-cp312-cp312-win_amd64.whl" }
